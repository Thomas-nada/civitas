<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/civitas-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta — overridden per-page by useSeoMeta hook and server-side injection -->
    <title>Civitas — Cardano Governance Dashboard</title>
    <meta name="description" content="Track Cardano governance proposals, DRep voting records, SPO participation, and Constitutional Committee decisions in real time." />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Civitas" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Civitas — Cardano Governance Dashboard" />
    <meta property="og:description" content="Track Cardano governance proposals, DRep voting records, SPO participation, and Constitutional Committee decisions in real time." />
    <meta property="og:url" content="https://www.civitasexplorer.com/" />
    <!-- Link previews need an absolute PNG/JPG; SVG and relative paths are ignored by X, Discord and most crawlers. -->
    <meta property="og:image" content="https://www.civitasexplorer.com/og-card.png" />
    <meta property="og:image:secure_url" content="https://www.civitasexplorer.com/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Civitas — Cardano governance, in one place" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Civitas — Cardano Governance Dashboard" />
    <meta name="twitter:description" content="Track Cardano governance proposals, DRep voting records, SPO participation, and Constitutional Committee decisions in real time." />
    <meta name="twitter:image" content="https://www.civitasexplorer.com/og-card.png" />
    <meta name="twitter:image:alt" content="Civitas — Cardano governance, in one place" />

    <!-- Canonical (overridden per-page by hook; server-side injection uses CANONICAL_URL env var) -->
    <link rel="canonical" href="https://www.civitasexplorer.com/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
