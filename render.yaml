services:
  - type: web
    name: civitas
    runtime: node
    plan: free
    autoDeploy: true
    rootDir: .
    # Root prod deps (cip-179, @evolution-sdk/evolution) are required by
    # lib/cip179.js at runtime for the surveys index; --omit=dev skips the
    # playwright devDependency (heavy browser download, e2e-only).
    # `npm run build` also builds the advent calendar (./advent) through the postbuild script.
    buildCommand: npm install --omit=dev && npm install --prefix frontend && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: GOV_META_VERIFY_SHADOW
        value: "0"
      - key: DREP_RATIONALE_WARM_ON_PUBLISH
        value: "false"
      - key: PERSIST_RUNTIME_SNAPSHOT_ON_PUBLISH
        value: "false"
      - key: BLOCKFROST_API_KEY
        sync: false
      # Optional: a Koios token for the advent calendar's chain lookups (higher rate limit).
      - key: KOIOS_API_TOKEN
        sync: false
      # The advent calendar keeps each wallet's opened doors in a secret GitHub Gist (Render's disk is wiped
      # on every deploy). A GitHub token with only the Gists read/write permission; see lib/adventProgress.js.
      - key: ADVENT_GIST_TOKEN
        sync: false
